version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # wait a week before proposing a brand-new release
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
