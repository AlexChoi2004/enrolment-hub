{% extends 'base.html' %}
{% block title %}Subjects · Enrolment Hub{% endblock %}
{% block content %}
<h1>Subjects</h1>
<p>Bachelor of Computing Science (Honours), Enterprise Software Development major.</p>

<form class="filters" method="get" action="{{ url_for('catalogue.list_page') }}"
      hx-get="{{ url_for('catalogue.list_page') }}" hx-target="#results"
      hx-trigger="input delay:300ms, change" hx-push-url="true">
  <label>Search name or code
    <input type="search" name="q" value="{{ filters.q }}" maxlength="50" autocomplete="off">
  </label>
  <label>Category
    <select name="category">
      <option value="">All</option>
      {% for c in categories %}
        <option value="{{ c.category }}" {{ 'selected' if filters.category == c.category }}>{{ c.label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Status
    <select name="status">
      <option value="">Any</option>
      <option value="available" {{ 'selected' if filters.status == 'available' }}>Can enrol</option>
      <option value="blocked" {{ 'selected' if filters.status == 'blocked' }}>Can't enrol</option>
      <option value="enrolled" {{ 'selected' if filters.status == 'enrolled' }}>Enrolled</option>
      <option value="completed" {{ 'selected' if filters.status == 'completed' }}>Completed</option>
    </select>
  </label>
  <label>Session
    <select name="session">
      <option value="">Any</option>
      {% for s in sessions %}
        <option value="{{ s }}" {{ 'selected' if filters.session == s }}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Prerequisites
    <select name="prereqs">
      <option value="">Any</option>
      <option value="supplied" {{ 'selected' if filters.prereqs == 'supplied' }}>Has a supplied rule</option>
      <option value="not_supplied" {{ 'selected' if filters.prereqs == 'not_supplied' }}>Not in supplied data</option>
    </select>
  </label>
  <button type="submit">Apply</button>
</form>

<div id="results">
  {% include 'catalogue/_results.html' %}
</div>
{% endblock %}
