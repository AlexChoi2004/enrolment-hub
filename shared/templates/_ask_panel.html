{% if g.user and g.user.ai_mode %}
<details class="ask-panel" open>
  <summary>Ask a question <span class="badge">AI mode</span></summary>
  <form class="ask-form" method="post" action="{{ url_for('ai.ask_question') }}" hx-post="{{ url_for('ai.ask_question') }}" hx-target="#ask-answer" hx-swap="innerHTML">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="text" name="question" maxlength="500" required placeholder="For example: What does Programming 2 require?" aria-label="Your question">
    <button type="submit" class="btn">Ask</button>
  </form>
  <div id="ask-answer" aria-live="polite"></div>
  <p class="hint">Answers come from the app's own sources and your own records, and are checked before they are shown. If it can't tell, you get "Not enough context". The AI can be wrong.</p>
</details>
{% endif %}
